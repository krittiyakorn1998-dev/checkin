<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ลงเวลาทำงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --line: #334155;
    --text: #f1f5f9; --muted: #94a3b8;
    --in: #16a34a; --out: #2563eb; --err: #dc2626; --warn: #d97706;
    --key: #273449; --key-press: #3b4a63;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Sarabun', system-ui, sans-serif; user-select: none; overflow: hidden; }
  .app { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; height: 100%; padding: 16px; }
  @media (orientation: portrait) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }

  .camera { position: relative; background: #000; border-radius: 16px; overflow: hidden; min-height: 240px; }
  .camera video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .camera .guide { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .camera .guide div { width: 45%; aspect-ratio: 3/4; border: 3px dashed rgba(255,255,255,.45); border-radius: 50%; }
  .camera .cam-msg { position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    padding: 24px; color: var(--muted); font-size: 20px; }

  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .clock { text-align: center; }
  .clock .time { font-size: clamp(40px, 7vw, 72px); font-weight: 700; line-height: 1; letter-spacing: 1px; }
  .clock .date { color: var(--muted); font-size: 18px; margin-top: 4px; }

  .entry { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; }
  .entry label { color: var(--muted); font-size: 15px; }
  .entry input { width: 100%; background: transparent; border: 0; outline: 0; color: var(--text);
    font: 700 clamp(26px, 4vw, 38px) 'Sarabun', sans-serif; letter-spacing: 3px; caret-color: var(--in); }
  .entry.bad { border-color: var(--err); }
  .hint { min-height: 22px; font-size: 16px; color: var(--muted); text-align: center; }
  .hint.bad { color: #fca5a5; }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; min-height: 0; }
  .keypad button { background: var(--key); color: var(--text); border: 0; border-radius: 12px;
    font: 600 clamp(22px, 3.2vw, 32px) 'Sarabun', sans-serif; min-height: 52px; }
  .keypad button:active { background: var(--key-press); }
  .keypad .small { font-size: 20px; color: var(--muted); }
  .ok { background: var(--in); color: #fff; border: 0; border-radius: 12px; min-height: 64px;
    font: 700 28px 'Sarabun', sans-serif; }
  .ok:active { filter: brightness(.9); }

  .bar { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
  .bar .pending { color: #fcd34d; }

  .overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(2,6,23,.82); z-index: 10; }
  .overlay.show { display: grid; }
  .card { width: min(92vw, 520px); background: var(--panel); border-radius: 20px; padding: 24px;
    text-align: center; border-top: 10px solid var(--in); }
  .card.out { border-color: var(--out); } .card.err { border-color: var(--err); } .card.warn { border-color: var(--warn); }
  .card img { width: 160px; height: 120px; object-fit: cover; border-radius: 12px; background: #000; }
  .card .type { font-size: 40px; font-weight: 700; margin-top: 10px; }
  .card.in .type { color: #4ade80; } .card.out .type { color: #60a5fa; }
  .card.err .type { color: #f87171; } .card.warn .type { color: #fbbf24; }
  .card .name { font-size: 26px; margin-top: 4px; }
  .card .when { font-size: 20px; color: var(--muted); margin-top: 6px; }
  .spinner { width: 54px; height: 54px; border: 6px solid var(--line); border-top-color: var(--in);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 10px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .setup-warn { position: fixed; top: 0; left: 0; right: 0; background: var(--err); color: #fff;
    text-align: center; padding: 6px; font-size: 15px; display: none; z-index: 20; }
</style>
</head>
<body>
<div class="setup-warn" id="setupWarn">ยังไม่ได้ใส่ SCRIPT_URL ในไฟล์ index.html</div>

<div class="app">
  <div class="camera">
    <video id="cam" autoplay playsinline muted></video>
    <div class="guide"><div></div></div>
    <div class="cam-msg" id="camMsg"></div>
  </div>

  <div class="side">
    <div class="clock">
      <div class="time" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
    </div>

    <div class="entry" id="entry">
      <label for="code">พิมพ์เลขบัตรประชาชน หรือยิงบาร์โค้ด</label>
      <input id="code" inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="20">
    </div>
    <div class="hint" id="hint">มองกล้องแล้วกด “ลงเวลา”</div>

    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="clear" class="small">ล้าง</button><button data-k="0">0</button><button data-k="back" class="small">ลบ</button>
    </div>
    <button class="ok" id="okBtn">ลงเวลา</button>

    <div class="bar">
      <span id="net">● ออนไลน์</span>
      <span class="pending" id="pending"></span>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="card">
    <div id="cardBody"></div>
  </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
/* ================= ตั้งค่า ================= */
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyfm59KPeICihbiZfGPUr-3eQEGu2WOfFY8nPYIsfRahvHHGidDgf2fQpkVGpf1vdUu/exec',
  KEY: 'CHANGE-ME-1234',     // ต้องตรงกับ KEY ใน Code.gs
  CHECK_THAI_ID: true,       // ถ้ากรอก 13 หลัก ให้ตรวจว่าเป็นเลขบัตรประชาชนที่ถูกต้อง
  MIN_LEN: 4,                // ความยาวขั้นต่ำของรหัส (กรณีใช้รหัสพนักงาน)
  RESULT_SECONDS: 4,         // แสดงผลกี่วินาทีแล้วกลับหน้าหลัก
  PHOTO_WIDTH: 480
};
/* ========================================== */

const $ = id => document.getElementById(id);
const video = $('cam'), input = $('code'), overlay = $('overlay');
const QUEUE_KEY = 'attendQueue';
let busy = false, overlayTimer = null, audioCtx = null, wakeLock = null;

if (!/^https:\/\/script\.google\.com\//.test(CONFIG.SCRIPT_URL)) $('setupWarn').style.display = 'block';

/* ---------- กล้อง ---------- */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
    video.srcObject = stream;
    $('camMsg').style.display = 'none';
  } catch (e) {
    const m = $('camMsg');
    m.style.display = 'grid';
    m.textContent = 'เปิดกล้องไม่ได้ — ตรวจว่าเปิดเว็บผ่าน https และอนุญาตให้ใช้กล้องแล้ว';
  }
}

function capturePhoto() {
  if (!video.videoWidth) return '';
  const c = $('canvas');
  const w = CONFIG.PHOTO_WIDTH, h = Math.round(w * video.videoHeight / video.videoWidth);
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);
  // ประทับวันเวลาบนรูป
  const stamp = new Date().toLocaleString('th-TH');
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, h - 28, w, 28);
  ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.fillText(stamp, 8, h - 9);
  return c.toDataURL('image/jpeg', 0.7);
}

/* ---------- นาฬิกา ---------- */
function tick() {
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString('th-TH', { hour12: false });
  $('date').textContent = now.toLocaleDateString('th-TH',
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
setInterval(tick, 1000); tick();

/* ---------- ตรวจเลขบัตรประชาชน ---------- */
function isThaiId(id) {
  if (!/^\d{13}$/.test(id)) return false;
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += Number(id[i]) * (13 - i);
  return (11 - (sum % 11)) % 10 === Number(id[12]);
}

function setHint(text, bad) {
  $('hint').textContent = text;
  $('hint').classList.toggle('bad', !!bad);
  $('entry').classList.toggle('bad', !!bad);
}

/* ---------- ช่องกรอก / ปุ่ม ---------- */
input.addEventListener('input', () => {
  input.value = input.value.replace(/\D/g, '').slice(0, 20);
  setHint(input.value.length === 13 && CONFIG.CHECK_THAI_ID && !isThaiId(input.value)
    ? 'เลขบัตรไม่ถูกต้อง กรุณาตรวจอีกครั้ง' : 'มองกล้องแล้วกด “ลงเวลา”',
    input.value.length === 13 && CONFIG.CHECK_THAI_ID && !isThaiId(input.value));
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); submit(); }
});

$('keypad').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k) return;
  unlockAudio();
  if (k === 'back') input.value = input.value.slice(0, -1);
  else if (k === 'clear') input.value = '';
  else if (input.value.length < 20) input.value += k;
  input.dispatchEvent(new Event('input'));
  input.focus();
});
$('okBtn').addEventListener('click', () => { unlockAudio(); submit(); });

// ให้ช่องกรอกพร้อมรับเครื่องยิงบาร์โค้ดตลอดเวลา
function keepFocus() { if (!overlay.classList.contains('show') && document.activeElement !== input) input.focus(); }
setInterval(keepFocus, 800);
document.addEventListener('click', () => setTimeout(keepFocus, 50));

/* ---------- ส่งข้อมูล ---------- */
async function send(payload) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 20000);
  try {
    const r = await fetch(CONFIG.SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    return await r.json();
  } finally { clearTimeout(t); }
}

async function submit() {
  if (busy) return;
  const id = input.value.replace(/\D/g, '');
  if (id.length < CONFIG.MIN_LEN) { setHint('กรุณากรอกรหัสให้ครบ', true); beep(false); return; }
  if (id.length === 13 && CONFIG.CHECK_THAI_ID && !isThaiId(id)) {
    setHint('เลขบัตรไม่ถูกต้อง กรุณาตรวจอีกครั้ง', true); beep(false); return;
  }

  busy = true;
  const photo = capturePhoto();
  const payload = { key: CONFIG.KEY, id, photo, ts: Date.now() };
  input.value = '';
  showCard('wait', { photo });

  try {
    const res = await send(payload);
    if (res.ok) {
      showCard(res.type === 'เข้างาน' ? 'in' : 'out', { photo, type: res.type, name: res.name, time: res.time });
      beep(true);
    } else {
      showCard(res.dup ? 'warn' : 'err', { photo, type: res.dup ? 'สแกนซ้ำ' : 'ไม่สำเร็จ', name: res.name || '', time: res.msg });
      beep(false);
    }
  } catch (e) {
    // เน็ตหลุด: เก็บไว้ในเครื่องก่อน แล้วส่งให้ภายหลัง
    enqueue(payload);
    showCard('warn', { photo, type: 'บันทึกไว้ในเครื่อง', name: 'รหัส ' + mask(id),
      time: new Date(payload.ts).toLocaleTimeString('th-TH', { hour12: false }) + ' น. — จะส่งเมื่อเน็ตกลับมา' });
    beep(true);
  }
  busy = false;
}

function mask(id) { return id.length > 6 ? id.slice(0, 1) + 'xxxxxxx' + id.slice(-4) : id; }

/* ---------- คิวออฟไลน์ ---------- */
function readQueue() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; } }
function writeQueue(q) {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }
  catch (e) {
    // พื้นที่เต็ม: ตัดรูปของรายการเก่าออก เหลือแค่เวลา
    q.forEach((x, i) => { if (i < q.length - 1) x.photo = ''; });
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e2) {}
  }
  updatePending();
}
function enqueue(p) { const q = readQueue(); q.push(p); writeQueue(q); }
function updatePending() {
  const n = readQueue().length;
  $('pending').textContent = n ? 'รอส่ง ' + n + ' รายการ' : '';
}

let flushing = false;
async function flushQueue() {
  if (flushing) return;
  let q = readQueue();
  if (!q.length) return;
  flushing = true;
  while (q.length) {
    try { await send(Object.assign({}, q[0], { queued: true })); }
    catch (e) { break; }            // ยังส่งไม่ได้ ไว้ลองใหม่รอบหน้า
    q.shift(); writeQueue(q);
  }
  flushing = false;
}
setInterval(flushQueue, 30000);
window.addEventListener('online', () => { setNet(); flushQueue(); });
window.addEventListener('offline', setNet);
function setNet() {
  $('net').textContent = navigator.onLine ? '● ออนไลน์' : '● ออฟไลน์';
  $('net').style.color = navigator.onLine ? '#4ade80' : '#f87171';
}

/* ---------- การ์ดแสดงผล ---------- */
function showCard(kind, d) {
  clearTimeout(overlayTimer);
  const card = $('card');
  card.className = 'card ' + (kind === 'wait' ? '' : kind);
  const img = d.photo ? '<img src="' + d.photo + '" alt="">' : '';
  $('cardBody').innerHTML = kind === 'wait'
    ? img + '<div class="spinner"></div><div class="when">กำลังบันทึก...</div>'
    : img + '<div class="type">' + esc(d.type || '') + '</div>'
          + '<div class="name">' + esc(d.name || '') + '</div>'
          + '<div class="when">' + esc(d.time || '') + '</div>';
  overlay.classList.add('show');
  if (kind !== 'wait') overlayTimer = setTimeout(hideCard, CONFIG.RESULT_SECONDS * 1000);
}
function hideCard() { overlay.classList.remove('show'); setHint('มองกล้องแล้วกด “ลงเวลา”'); input.focus(); }
overlay.addEventListener('click', () => { if (!busy) hideCard(); });
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- เสียง ---------- */
function unlockAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
}
function beep(ok) {
  try {
    unlockAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = ok ? 1100 : 300; o.type = ok ? 'sine' : 'square';
    g.gain.value = 0.15; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (ok ? 0.15 : 0.4));
  } catch (e) {}
}

/* ---------- ไม่ให้จอดับ ---------- */
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

startCamera(); keepAwake(); setNet(); updatePending(); flushQueue(); input.focus();
</script>
</body>
</html>
